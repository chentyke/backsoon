name: Check
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check for tracked local files
        run: test -z "$(git ls-files --cached --ignored --exclude-standard)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test commands, translations and packed installation
        run: npm test
      - name: Install Chromium for the panel tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npx --no-install playwright install --with-deps chromium
      - name: Test the panel in all supported languages
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:panel
